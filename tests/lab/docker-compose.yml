# Lab do módulo SLA dashboard: Zabbix 8.0 oficial (server + frontend nginx) + PostgreSQL.
# Frontend em http://localhost:8090 (Admin/zabbix). O módulo é montado direto do repositório.
name: slalab
services:
  db:
    image: postgres:17
    container_name: slalab-db
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    volumes: [db:/var/lib/postgresql/data]
  server:
    image: zabbix/zabbix-server-pgsql:ubuntu-8.0-latest
    container_name: slalab-server
    environment:
      DB_SERVER_HOST: db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      ZBX_CACHEUPDATEFREQUENCY: 10
    ports: ["10051:10051"]
    depends_on: [db]
  web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-8.0-latest
    container_name: slalab-web
    environment:
      ZBX_SERVER_HOST: server
      DB_SERVER_HOST: db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      PHP_TZ: America/Sao_Paulo
    ports: ["8090:8080"]
    volumes:
      - ../../sla_dashboard:/usr/share/zabbix/modules/sla_dashboard:ro
    depends_on: [server]
volumes:
  db:
